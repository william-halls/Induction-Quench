<svg xmlns="http://www.w3.org/2000/svg" width="780" height="510" viewBox="0 0 780 510" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <rect x="0" y="0" width="780" height="510" fill="#fcfcfb"/>

  <!-- Title -->
  <text x="40" y="28" font-size="17" font-weight="600" fill="#0b0b0b">Lava (Alumina Silicate) Firing Cycle &#8212; McMaster 8479K69, unfired &#8594; fired</text>
  <text x="40" y="48" font-size="12.5" fill="#52514e">Ramp governed by the thick teal body (&#8960;20mm, &#8805;13mm section). Soak targeted at the low end of the maturing band for furnace-error margin.</text>

  <!-- Maturing band 1,010-1,093 C -->
  <rect x="75" y="97.68" width="650" height="19.92" fill="#cde2fb" opacity="0.6"/>

  <!-- Horizontal gridlines -->
  <g stroke="#e1e0d9" stroke-width="1">
    <line x1="75" y1="360" x2="725" y2="360"/>
    <line x1="75" y1="300" x2="725" y2="300"/>
    <line x1="75" y1="240" x2="725" y2="240"/>
    <line x1="75" y1="180" x2="725" y2="180"/>
    <line x1="75" y1="120" x2="725" y2="120"/>
  </g>
  <g font-size="11" fill="#898781" text-anchor="end">
    <text x="67" y="363.5">0</text>
    <text x="67" y="303.5">250</text>
    <text x="67" y="243.5">500</text>
    <text x="67" y="183.5">750</text>
    <text x="67" y="123.5">1,000</text>
  </g>
  <text x="20" y="215" font-size="12" fill="#52514e" transform="rotate(-90 20 215)">Temperature (&#176;C)</text>

  <!-- Vertical gridlines -->
  <g stroke="#e1e0d9" stroke-width="1">
    <line x1="200" y1="60" x2="200" y2="360"/>
    <line x1="325" y1="60" x2="325" y2="360"/>
    <line x1="450" y1="60" x2="450" y2="360"/>
    <line x1="575" y1="60" x2="575" y2="360"/>
    <line x1="700" y1="60" x2="700" y2="360"/>
  </g>
  <g font-size="11" fill="#898781" text-anchor="middle">
    <text x="75"  y="378">0</text>
    <text x="200" y="378">10</text>
    <text x="325" y="378">20</text>
    <text x="450" y="378">30</text>
    <text x="575" y="378">40</text>
    <text x="700" y="378">50</text>
  </g>
  <text x="400" y="397" font-size="12" fill="#52514e" text-anchor="middle">Time from cold start (hours)</text>

  <!-- Axes -->
  <line x1="75" y1="360" x2="725" y2="360" stroke="#c3c2b7" stroke-width="1.5"/>
  <line x1="75" y1="60"  x2="75"  y2="360" stroke="#c3c2b7" stroke-width="1.5"/>

  <!-- Never-exceed 1,093 C -->
  <line x1="75" y1="97.68" x2="725" y2="97.68" stroke="#d03b3b" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="79" y="78" font-size="11.5" font-weight="600" fill="#d03b3b">1,093&#176;C never-exceed &#8212; crystallization, distortion, shrinkage, loss of properties</text>
  <text x="79" y="91" font-size="10.5" fill="#898781">(unfired max-temp rating of 1,099&#176;C sits 6&#176;C above this &#8212; too close to plot separately)</text>

  <!-- Allowable ramp envelope: 28-83 C/hr -->
  <polygon points="75,355.2 225.6,115.2 521.4,115.2" fill="#2a78d6" opacity="0.13"/>

  <!-- Recommended cycle: ramp 40 C/hr + 45 min soak (solid = specified) -->
  <polyline points="75,355.2 387.5,115.2 396.9,115.2" fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Passive cooldown (dashed = not specified by mfr, schematic shape) -->
  <polyline points="396.9,115.2 421.9,163.2 446.9,201.6 484.4,247.2 534.4,290.4 584.4,321.6 621.9,337.68"
            fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7,5"/>

  <!-- Key markers -->
  <circle cx="75"    cy="355.2" r="4.5" fill="#2a78d6"/>
  <circle cx="387.5" cy="115.2" r="4.5" fill="#2a78d6"/>
  <circle cx="396.9" cy="115.2" r="4.5" fill="#2a78d6"/>

  <!-- Soak label -->
  <text x="392" y="109" font-size="11.5" font-weight="600" fill="#1c5cab" text-anchor="middle">soak 1,020&#176;C &#215; 45 min</text>

  <!-- Start label -->
  <text x="84" y="351" font-size="11.5" fill="#0b0b0b">20&#176;C cold start</text>

  <!-- Recommended-line callout -->
  <text x="258" y="243" font-size="11.5" font-weight="600" fill="#1c5cab">recommended ramp ~40&#176;C/hr</text>
  <text x="258" y="257" font-size="11" fill="#52514e">reaches soak at 25.0 hr</text>

  <!-- Ramp-options annotation block -->
  <rect x="498" y="140" width="227" height="76" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1" rx="3"/>
  <text x="508" y="157" font-size="11.5" font-weight="600" fill="#0b0b0b">Allowable ramp, thick section</text>
  <text x="508" y="174" font-size="11" fill="#52514e">28&#176;C/hr &#8594; 35.7 hr  (slowest, safest)</text>
  <text x="508" y="190" font-size="11" fill="#1c5cab" font-weight="600">40&#176;C/hr &#8594; 25.0 hr  (recommended)</text>
  <text x="508" y="206" font-size="11" fill="#52514e">83&#176;C/hr &#8594; 12.0 hr  (fastest allowed)</text>

  <!-- Cooldown callout -->
  <text x="716" y="258" font-size="11.5" fill="#52514e" text-anchor="end">passive cool, furnace-closed</text>
  <text x="716" y="272" font-size="11" fill="#898781" text-anchor="end">no mandated rate &#8212; shape is schematic</text>

  <!-- 93 C unload threshold -->
  <line x1="75" y1="337.68" x2="725" y2="337.68" stroke="#898781" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="300" y="333" font-size="11.5" fill="#52514e">93&#176;C &#8212; do not unload above this</text>

  <!-- Legend -->
  <g font-size="12">
    <line x1="75" y1="422" x2="105" y2="422" stroke="#2a78d6" stroke-width="2.5" stroke-linecap="round"/>
    <text x="112" y="426" fill="#0b0b0b">Specified by the schedule (ramp rate + soak temp/time)</text>
    <line x1="420" y1="422" x2="450" y2="422" stroke="#2a78d6" stroke-width="2.5" stroke-dasharray="7,5" stroke-linecap="round"/>
    <text x="457" y="426" fill="#0b0b0b">Not specified &#8212; schematic</text>
    <rect x="75" y="437" width="30" height="11" fill="#2a78d6" opacity="0.13"/>
    <text x="112" y="446" fill="#0b0b0b">Full allowable ramp envelope (28&#8211;83&#176;C/hr)</text>
    <line x1="420" y1="442" x2="450" y2="442" stroke="#d03b3b" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="457" y="446" fill="#0b0b0b">Hard limit</text>
  </g>

  <!-- Footnotes -->
  <text x="75" y="474" font-size="11" fill="#52514e">Total cycle at the recommended ramp: <tspan font-weight="600">~38&#8211;50 hr</tspan> (25.0 hr up + 0.75 hr soak + 12&#8211;24 hr passive cool). At the 28&#176;C/hr slow bound: ~49&#8211;61 hr.</text>
  <text x="75" y="490" font-size="11" fill="#52514e">Part <tspan font-weight="600">expands ~2%</tspan> when fired &#8212; size green-state machining for growth. Drill stress-relief holes in the thick body first. Air atmosphere, nothing special.</text>
  <text x="75" y="506" font-size="10.5" fill="#898781">Source: generic &#8220;Grade A aluminum silicate&#8221; family schedule (Foundry Service &amp; Supply) &#8212; <tspan font-style="italic">not</tspan> McMaster-published for 8479K69. Confirm with supplier before firing.</text>
</svg>
